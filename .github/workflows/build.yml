name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Ohne google-services.json: Build und Tests laufen, Firebase ist in dieser APK nicht konfiguriert.
      - name: Build, Unit-Tests, Lint
        run: |
          set -o pipefail
          ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug 2>&1 | tee build.log

      # Fehlerzusammenfassung als Annotation, damit sie auch ohne Log-Download lesbar ist.
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          {
            grep -n -E "^e: |error:|FAILED|What went wrong|Could not|Execution failed|Caused by" -A3 build.log | head -80
          } > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt | head -c 3500)
          echo "::error title=Build-Fehler::${msg}"

      - name: Debug-APK hochladen
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: obelix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
