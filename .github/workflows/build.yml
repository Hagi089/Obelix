name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Fester Signaturschlüssel aus den GitHub-Secrets (nur bei Push auf main, nie bei Pull Requests): Damit lassen
      # sich neue Versionen als Update installieren, ohne die App vorher zu deinstallieren. Der Schlüssel liegt nur
      # während des Laufs im temporären Ordner des Runners.
      - name: Signaturschlüssel bereitstellen
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.OBELIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OBELIX_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/obelix-signing.p12"
            echo "OBELIX_KEYSTORE_FILE=$RUNNER_TEMP/obelix-signing.p12" >> "$GITHUB_ENV"
            echo "OBELIX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "OBELIX_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=Kein fester Signaturschlüssel::Die Secrets OBELIX_KEYSTORE_BASE64 und OBELIX_KEYSTORE_PASSWORD fehlen. Es entsteht nur eine Debug-APK mit zufälligem Schlüssel (nicht zum Verteilen, kein Update ohne Deinstallieren)."
          fi

      # google-services.json liegt im Repository, die APK ist daher mit dem echten Firebase-Projekt verbunden.
      # Die Release-APK wird immer gebaut (prüft den Release-Bau); verteilbar ist sie nur mit festem Schlüssel.
      - name: Build, Unit-Tests, Lint
        run: |
          set -o pipefail
          ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug assembleRelease 2>&1 | tee build.log

      # Fehlerzusammenfassung als Annotation, damit sie auch ohne Log-Download lesbar ist.
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          {
            grep -n -E "^e: |error:|FAILED|What went wrong|Could not|Execution failed|Caused by" -A3 build.log | head -80
          } > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt | head -c 3500)
          echo "::error title=Build-Fehler::${msg}"

      # Phase 9: Kontrolle, welche Berechtigungen die fertige App wirklich anfordert (Kartenbibliothek bringt eigene mit).
      - name: Berechtigungen der App anzeigen
        if: success()
        run: |
          f=$(find app/build/intermediates -name AndroidManifest.xml -path "*merged_manifest*" -path "*ebug*" | head -1)
          echo "Manifest: $f"
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$f" | grep -o 'android:name="[^"]*"' | sort -u

      # Kontrolle: Mit welchem Zertifikat ist die Release-APK signiert? (SHA-256 muss bei jeder Version gleich sein.)
      - name: Signatur der APK anzeigen
        if: success() && env.OBELIX_SIGNED == 'true'
        run: |
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cert=$("$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 "SHA-256" || true)
          echo "::notice title=Signatur der APK::${cert:-nicht ermittelt}"

      - name: APK zum Verteilen hochladen (fest signiert)
        if: success() && env.OBELIX_SIGNED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: obelix-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Debug-APK hochladen (ohne festen Schlüssel, nur zum Testen)
        if: success() && env.OBELIX_SIGNED != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: obelix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

  # Sicherheitsregeln (Phase 3): Tests im Firebase-Emulator, ohne Zugriff auf das echte Projekt.
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Werkzeuge installieren
        run: |
          set -o pipefail
          {
            npm install -g firebase-tools
            firebase --version
            npm install --prefix firebase/rules-tests
            npm ls --prefix firebase/rules-tests --depth=0 || true
          } 2>&1 | tee rules.log

      - name: Regeln im Emulator testen
        working-directory: firebase
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-obelix "npm --prefix rules-tests test" 2>&1 | tee -a ../rules.log

      - name: Ergebnis der Regel-Tests ausgeben
        if: always()
        run: |
          summary=$(grep -E "^(ℹ|#) (tests|suites|pass|fail|cancelled|skipped)" rules.log | tr '\n' ' ')
          echo "::notice title=Regel-Tests::${summary:-keine Testzusammenfassung im Log gefunden}"

      - name: Fehler zusammenfassen
        if: failure()
        run: |
          {
            grep -n -E "not ok|✖|failureType|AssertionError|Error:|error:|ERR!|Could not|Java|Unable|peer" -A2 rules.log | head -80
          } > rules-errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' rules-errors.txt | head -c 3500)
          echo "::error title=Regel-Test-Fehler::${msg}"

      - name: Log hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rules-log
          path: rules.log
          if-no-files-found: ignore
