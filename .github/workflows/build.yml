name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Ohne google-services.json: Build und Tests laufen, Firebase ist in dieser APK nicht konfiguriert.
      - name: Build, Unit-Tests, Lint
        run: |
          set -o pipefail
          ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug 2>&1 | tee build.log

      # Fehlerzusammenfassung als Annotation, damit sie auch ohne Log-Download lesbar ist.
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          {
            grep -n -E "^e: |error:|FAILED|What went wrong|Could not|Execution failed|Caused by" -A3 build.log | head -80
          } > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt | head -c 3500)
          echo "::error title=Build-Fehler::${msg}"

      - name: Debug-APK hochladen
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: obelix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

  # Sicherheitsregeln (Phase 3): Tests im Firebase-Emulator, ohne Zugriff auf das echte Projekt.
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Werkzeuge installieren
        run: |
          npm install -g firebase-tools
          firebase --version
          npm install --prefix firebase/rules-tests
          npm ls --prefix firebase/rules-tests --depth=0

      - name: Regeln im Emulator testen
        working-directory: firebase
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore --project demo-obelix "npm --prefix rules-tests test" 2>&1 | tee ../rules.log

      - name: Fehler zusammenfassen
        if: failure()
        run: |
          {
            grep -n -E "not ok|✖|failureType|AssertionError|Error:|error:|Could not|Java|Unable" -A2 rules.log | head -80
          } > rules-errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' rules-errors.txt | head -c 3500)
          echo "::error title=Regel-Test-Fehler::${msg}"

      - name: Log hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rules-log
          path: rules.log
          if-no-files-found: ignore
