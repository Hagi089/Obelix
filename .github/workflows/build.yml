name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Ohne google-services.json: Build und Tests laufen, Firebase ist in dieser APK nicht konfiguriert.
      - name: Build, Unit-Tests, Lint
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Berichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
